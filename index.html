 *               the last survivor, the winner

 *               stuns and speed boosts, and the last few events (every client plays their

 *       `bots`  every bot's position, ~10 times a second

 *   - Bites need no messages: the host compares everyone's latest position every frame.

const MP_CONNECT = {

const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */

let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */

    $("big").innerHTML = big ? `<div>${big}</div>` : "";
    return;
  }
  $("round").innerHTML = G.phase === "over" ? "" : `${G.phase === "brief" ? "Get ready" : fmt(Math.max(0, G.endsAt - t))}${counter}`;
  $("role").classList.toggle("zombie", z); $("role").classList.toggle("human", !z);
  $("role").textContent = !e || G.phase === "over" ? "" : z ? "ZOMBIE" : G.last === id ? "LAST SURVIVOR" : "SURVIVOR";
  if (G.phase === "brief" && e) {
    const n = Math.max(1, Math.ceil((G.startAt - t) / 1000));
    big = z ? `<span class="z">${n}</span><small>You're a zombie. Touch survivors to turn them.</small>` : `RUN!<small>The dead rise in ${n}…</small>`;
  }
  $("big").innerHTML = big ? `<div>${big}</div>` : "";
  let msg = now < local.toastUntil ? local.toast : "";
  if (!msg && G.phase !== "over" && e) {
    if (!me.playAt) me.playAt = now;
    if (now - me.playAt < 10000) msg = z ? (touchUI ? "Drag to run · touch survivors to turn them" : "WASD or hold the mouse to run · touch survivors to turn them")
      : touchUI ? "Drag to run · SHOVE pushes zombies back · grab glowing items" : "WASD or hold the mouse to run · Space shoves · E uses your item";
  }
  if (!e && G.phase !== "over") msg = "You'll play the next round. Watch out!";
  $("msg").textContent = msg;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : reconnecting ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${hosting ? " · you run the outbreak" : ""}`;
  const canAct = !!e && !z && G.phase !== "over";
  $("slot").hidden = touchUI || !canAct || !held;
  $("shove").hidden = $("use").hidden = !touchUI || !canAct;
  $("shove").classList.toggle("wait", now < me.shoveReady);
  $("use").classList.toggle("wait", !held);
  if (iconShown !== held) { iconShown = held; paintIcon($("slotIcon"), held); paintIcon($("useIcon"), held); $("useIcon").hidden = !held; $("useText").hidden = !!held; $("slotText").innerHTML = held ? `<b>E</b> ${ITEMS[held].name}: ${ITEMS[held].tip}` : ""; }
  const over = G.phase === "over" && t - G.endedAt > 1300;
  $("over").hidden = !over;
  if (over) results(G, t);
}
function paintIcon(c, kind) { const g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height); if (kind) itemIcon(g, kind, c.width / 2, c.height / 2, c.width * 0.36); }
function results(G, t) {
  const id = net.sessionId, inRound = !!G.pp[id] && me.g === G.id, mine = scoreOf(G, id);
  const lastName = G.last ? (G.last === id ? "You" : nameOf(G.last)) : "";
  $("overTitle").textContent = G.win === "humans" ? (inRound && mine.human ? "You made it! Survivors win" : "Survivors win!") : G.win === "zombies" ? (lastName ? `${lastName} fell last. Zombies win` : "Everyone turned. Zombies win") : "Round over";
  $("overLine").textContent = inRound ? `Human for ${fmt(mine.ms)} · ${mine.bites} bite${mine.bites === 1 ? "" : "s"} · ${mine.pts} point${mine.pts === 1 ? "" : "s"}` : "You'll play the next round.";
  const all = Object.keys(G.pp).map((i) => ({ id: i, name: i === id ? "You" : nameOf(i), ...scoreOf(G, i) })).sort((a, b) => b.pts - a.pts);
  const rows = all.slice(0, 8), mineRow = all.findIndex((r) => r.id === id);
  if (mineRow >= 8) rows[7] = all[mineRow]; // always show your own line
  $("results").innerHTML = rows.map((r) => `<li value="${all.indexOf(r) + 1}" class="${r.id === id ? "me" : ""} ${r.human ? "" : "z"}">${esc(r.name)}<span>${fmt(r.ms)} · ${r.bites} bite${r.bites === 1 ? "" : "s"} · ${r.pts}</span></li>`).join("");
  $("next").textContent = `Next round in ${Math.max(0, Math.ceil((G.endsAt - t) / 1000))}s`;
  if (boardFor !== G.id) { boardFor = G.id; showBoard(inRound ? mine.pts : 0); }
}
function showBoard(score) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li class='note'>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li class='note'>Loading…</li>";
  (score > 0 ? board.submit(score).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} pts</span></li>`).join("") : "<li class='note'>No scores yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li class='note'>Couldn't load the leaderboard.</li>"; });
}
/** Keep a color nobody else has: the later sessionId gives way, and the bots' colors count as taken. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botsNow().map((b) => b.color);
  if (!others.some(([id, p]) => id < net.sessionId && p.c === myColor) && !bots.includes(myColor)) return;
  const used = new Set([...others.map(([, p]) => p.c), ...bots]), free = COLORS.find((c) => !used.has(c));
  if (free && free !== myColor) { myColor = free; net.me.set("c", myColor); }
}
$("again").onclick = () => { const G = game(); if (!G || G.phase !== "over") return; if (hosting) host.again = true; else net.send("again", {}); $("over").hidden = true; };

/** One-off effects, worked out from what changed in state (so nobody misses one). */
let prevG = null, evSeen = { g: -1, max: Infinity };
const shoveAnim = new Map();
function effects(G, w, now) {
  const id = net.sessionId, near = (x, y) => clamp(1 - Math.hypot(x - cam.x, y - cam.y) / 900, 0.15, 1);
  if (w.g === G.id) {
    if (evSeen.g !== w.g) evSeen = { g: w.g, max: evSeen.max === Infinity ? Math.max(0, ...w.ev.map((e) => e[0])) : 0 }; // joining: old events already happened
    for (const e of w.ev) {
      if (e[0] <= evSeen.max) continue;
      evSeen.max = e[0];
      const [, kind, x, y, a, b] = e;
      if (kind === "bite") {
        burst(x, y, ["#7ee081", "#b3ff8a", "#c0392b"], 26, 260, 0.8, 3.5); splat(x, y, "#3f7a2c", 9); ring(x, y, "#8ef08a", 70, 0.5);
        sound("bite", near(x, y));
        if (b === id) floatText(x, y - 20, `+${CONFIG.points.bite} BITE`, "#8ef08a");
        if (a === id && !ATTRACT) { cam.shake = 0.9; fx.bittenAt = now; bigText(`<span class="z">BITTEN!</span><small>You're one of them now. Catch the rest!</small>`, 2200); sound("turned"); }
      }
      if (kind === "pick") { burst(x, y, ["#fff", "#ffe066"], 12, 120, 0.5, 2.5); if (a === id) { sound("pick"); toast(`${ITEMS[b].name}! ${touchUI ? "Tap the item button" : "Press E"} to ${ITEMS[b].tip}.`); } }
      if (kind === "shoes") { burst(x, y, ["#4da3ff", "#bfe0ff"], 16, 160, 0.5); if (a === id) sound("shoes"); }
      if (kind === "decoy") { burst(x, y, ["#ff9f43", "#ffe066"], 14, 140, 0.5); sound("decoy", near(x, y)); }
      if (kind === "flash") {
        ring(x, y, "#ffffff", CONFIG.flashReach, 0.6, 8); burst(x, y, ["#ffffff", "#fff6c8"], 30, 380, 0.6, 3);
        const k = clamp(1 - Math.hypot(x - cam.x, y - cam.y) / 500, 0, 1) * (ATTRACT ? 0.5 : 1);
        fx.flashAt = now; fx.fx = x; fx.fy = y; fx.flashK = k; sound("flash", near(x, y)); cam.shake = Math.max(cam.shake, k * 0.6);
      }
      if (kind === "boards") { burst(x, y, ["#b07a42", "#e0b07a"], 16, 140, 0.6); sound("boards", near(x, y)); }
      if (kind === "unbar") { burst(x, y, ["#b07a42", "#8a5a2c"], 14, 180, 0.7); sound("crack", near(x, y)); }
      if (kind === "shove") { shoveAnim.set(a, now); ring(x, y, "#ffffffcc", CONFIG.shoveReach, 0.35, 5); if (a !== id) sound("shove", near(x, y) * 0.7); }
      if (kind === "pop") { burst(x, y, ["#c9a26b", "#8a6a3e"], 14, 160, 0.6); }
      if (kind === "rise") { burst(x, y, ["#7ee081", "#3f7a2c"], 20, 200, 0.7); sound("bite", near(x, y)); }
    }
  }
  if (prevG && prevG.id === G.id) {
    if (G.phase === "play" && prevG.phase === "brief") { sound("go"); if (isZombie(G, id)) bigText(`<span class="z">GO!</span>`, 700); }
    if (G.last && !prevG.last && G.phase === "play") {
      const mine = G.last === id;
      bigText(`<span class="r">LAST SURVIVOR</span><small>${mine ? "That's you. Don't stop running!" : esc(nameOf(G.last)) + " is the last one human. Get them!"}</small>`, 2600);
      sound("last"); cam.shake = Math.max(cam.shake, 0.5);
      if (mine) me.shoveReady = 0; // adrenaline: your shove is ready
    }
    if (G.phase === "over" && prevG.phase !== "over") {
      sound(G.win === "humans" ? "win" : "lose");
      bigText(G.win === "humans" ? "SURVIVORS WIN" : G.win === "zombies" ? `<span class="z">ZOMBIES WIN</span>` : "", 1300);
    }
  }
  if (G.phase === "play" && G.last && now > (fx.beatAt || 0)) { fx.beatAt = now + 780; sound("beat", G.last === id ? 1 : 0.4); } // a heartbeat while there's a last survivor
  prevG = { id: G.id, phase: G.phase, last: G.last }; // a copy: the host changes its G in place
}

// ── INPUT & SOUND ───────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
if (touchUI) $("msg").style.bottom = "calc(max(18px, env(safe-area-inset-bottom)) + 190px)";
const keys = new Set(), stick = { id: -1, ox: 0, oy: 0, mx: 0, my: 0 }, mouse = { down: false, x: 0, y: 0 };
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase(); keys.add(k); unlockAudio();
  if (k === " ") { e.preventDefault(); if (!e.repeat) tryShove(); }
  if ((k === "e" || k === "q" || k === "shift") && !e.repeat) tryUse();
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.down = false; });
/** Keys, the touch stick, or (held mouse) toward the pointer, through the camera that drew the frame. */
function readInput() {
  const k = (a, b) => (keys.has(a) || keys.has(b) ? 1 : 0);
  let mx = k("d", "arrowright") - k("a", "arrowleft") + stick.mx, my = k("s", "arrowdown") - k("w", "arrowup") + stick.my;
  if (!mx && !my && mouse.down) {
    const wx = cam.x + (mouse.x - VW / 2) / cam.z, wy = cam.y + (mouse.y - VH / 2) / cam.z, dx = wx - me.x, dy = wy - me.y, d = Math.hypot(dx, dy);
    if (d > 8) { mx = dx / d; my = dy / d; }
  }
  return { mx, my };
}
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (e.pointerType === "mouse") { if (e.button === 2) tryShove(); else mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; return; }
  if (stick.id >= 0) return;
  cv.setPointerCapture(e.pointerId);
  Object.assign(stick, { id: e.pointerId, ox: e.clientX, oy: e.clientY, mx: 0, my: 0 });
  Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; }
  if (e.pointerId !== stick.id) return;
  const dx = e.clientX - stick.ox, dy = e.clientY - stick.oy, d = Math.hypot(dx, dy), k = Math.min(1, d / 45) / (d || 1);
  stick.mx = dx * k; stick.my = dy * k;
  $("stick").firstElementChild.style.transform = `translate(${stick.mx * 35}px, ${stick.my * 35}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => { // on the window: a mouse button let go over the results card still counts
  if (e.pointerType === "mouse" && e.button !== 2) mouse.down = false;
  if (e.pointerId === stick.id) { Object.assign(stick, { id: -1, mx: 0, my: 0 }); $("stick").hidden = true; }
});
$("shove").addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); tryShove(); });
$("use").addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); tryUse(); });
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });

let AC = null, NOISE = null;
function unlockAudio() {
  if (AC || ATTRACT) return;
  try {
    AC = new AudioContext();
    NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch { AC = null; }
}
function sound(kind, vol = 1) {
  if (!AC) return;
  const t0 = AC.currentTime;
  const tone = (f, d, type, v, f2, delay = 0) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0 + delay); o.frequency.exponentialRampToValueAtTime(f2, t0 + delay + d);
    g.gain.setValueAtTime(0.0001, t0); g.gain.setValueAtTime(v * vol, t0 + delay); g.gain.exponentialRampToValueAtTime(0.001, t0 + delay + d); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + delay + d);
  };
  const hiss = (d, v, freq, delay = 0) => {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = NOISE; f.type = "bandpass"; f.frequency.value = freq;
    g.gain.setValueAtTime(v * vol, t0 + delay); g.gain.exponentialRampToValueAtTime(0.001, t0 + delay + d); s.connect(f).connect(g).connect(AC.destination); s.start(t0 + delay); s.stop(t0 + delay + d);
  };
  if (kind === "bite") { tone(150, 0.5, "sawtooth", 0.08, 70); hiss(0.25, 0.12, 900); }
  if (kind === "turned") { tone(110, 0.9, "sawtooth", 0.12, 45); tone(165, 0.8, "square", 0.04, 60, 0.05); }
  if (kind === "shove") hiss(0.18, 0.25, 1400);
  if (kind === "pick") { tone(660, 0.12, "triangle", 0.12, 990); tone(990, 0.15, "triangle", 0.1, 1320, 0.08); }
  if (kind === "shoes") tone(300, 0.3, "sine", 0.1, 900);
  if (kind === "decoy") { tone(520, 0.12, "square", 0.06, 520); tone(700, 0.15, "square", 0.06, 700, 0.15); }
  if (kind === "flash") { hiss(0.5, 0.5, 2500); tone(3200, 0.9, "sine", 0.05, 2900); }
  if (kind === "boards") for (let i = 0; i < 3; i++) tone(120, 0.08, "square", 0.1, 60, i * 0.12);
  if (kind === "crack") hiss(0.3, 0.3, 600);
  if (kind === "go") { tone(440, 0.25, "square", 0.06, 440); tone(660, 0.4, "square", 0.06, 660, 0.25); }
  if (kind === "last") { tone(98, 1.4, "sawtooth", 0.08, 92); tone(147, 1.4, "sawtooth", 0.05, 139); tone(196, 1.2, "triangle", 0.06, 185, 0.1); }
  if (kind === "beat") { tone(70, 0.12, "sine", 0.25, 45); tone(62, 0.12, "sine", 0.18, 40, 0.18); }
  if (kind === "win") { tone(523, 0.5, "triangle", 0.12, 523); tone(659, 0.5, "triangle", 0.1, 659, 0.12); tone(784, 0.8, "triangle", 0.1, 784, 0.24); }
  if (kind === "lose") { tone(220, 1.2, "sawtooth", 0.07, 110); tone(233, 1.2, "sawtooth", 0.05, 116); }
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame); // first, so one bad frame can't stop the game
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.was = false; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  hosting = isHost();
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (hosting) hostTick(dt, now); else host.was = false;
  const G = game();
  if (!G) { // waiting for the host's first round
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = "#07090f"; ctx.fillRect(0, 0, VW, VH);
    ctx.setTransform(DPR * cam.z, 0, 0, DPR * cam.z, DPR * (VW / 2 - cam.x * cam.z), DPR * (VH / 2 - cam.y * cam.z)); ctx.globalAlpha = 0.4; ctx.drawImage(mapCanvas, 0, 0, WW, WH); ctx.globalAlpha = 1;
    return;
  }
  const w = world();
  myTick(dt, now, G, w);
  effects(G, w, now);
  draw(G, w, now, dt);
  if (now - lastHud > 100) { lastHud = now; hud(G, w, now); }
}

(async function start() {
  net = await connect();
  me.id = net.sessionId;
  net.onState((st) => { S = st; });
  net.on("pick", (m, from) => { if (hosting && host.G && m) applyPick(from, m.i, m); });
  net.on("use", (m, from) => { if (hosting && host.G) applyUse(from, m); });
  net.on("shove", (m, from) => { if (hosting && host.G) applyShove(from, m); });
  net.on("again", () => { if (hosting && host.G && host.G.phase === "over") host.again = true; });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b[2])]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
